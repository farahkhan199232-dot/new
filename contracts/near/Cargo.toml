[package]
name = "chai-pot-near"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Chai Pot on NEAR: a group pot whose AI agent can only spend inside limits enforced on-chain"
repository = "https://github.com/farahkhan199232-dot/new"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.6"

[dev-dependencies]
near-sdk = { version = "5.6", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
