[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
# Same compiler settings as the deployed SplitChai contract.
solc = "0.8.28"
optimizer = true
optimizer_runs = 10000
evm_version = "cancun"
# The Fe artifact is read from ../out (run `fe build` in the repo root first).
fs_permissions = [{ access = "read", path = "../out" }]

[fuzz]
runs = 1000

[fmt]
# Keep the reference contract byte-identical to the deployed source.
ignore = ["src/**"]
